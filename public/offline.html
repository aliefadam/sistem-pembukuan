<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>Offline - Pembukuan Usaha</title>
  <style>
    * { box-sizing: border-box; }
    body {
      display: grid;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      place-items: center;
      background: #f8fafc;
      color: #1e293b;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }
    main { width: min(100%, 420px); }
    .brand {
      display: grid;
      width: 80px;
      height: 80px;
      margin: 0 auto 28px;
      place-items: center;
      border-radius: 24px;
      background: #2563eb;
      box-shadow: 0 12px 28px #2563eb40;
      color: white;
    }
    .status {
      display: grid;
      width: 48px;
      height: 48px;
      margin: 0 auto 12px;
      place-items: center;
      border-radius: 50%;
      background: #fef2f2;
      color: #ef4444;
    }
    h1 { margin: 0; font-size: 21px; }
    p { margin: 10px 0 0; color: #64748b; font-size: 14px; line-height: 1.6; }
    button {
      margin-top: 24px;
      padding: 12px 20px;
      border: 0;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #020617; color: #f1f5f9; }
      p { color: #94a3b8; }
      .status { background: #451a1a; }
    }
  </style>
</head>
<body>
  <main>
    <div class="brand" aria-hidden="true">
      <svg viewBox="0 0 48 48" width="44" height="44" fill="none">
        <path d="M8 18h32v22H8zM17 18v-5a7 7 0 0 1 14 0v5M8 27h32M22 27v4h4v-4" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="status" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none">
        <path d="M3 3l18 18M10.6 5.2a14.7 14.7 0 0 1 10.4 4.2M6.1 8.1a10.7 10.7 0 0 1 3.1-1.8M2.9 12a6.8 6.8 0 0 1 3.5-2M8.5 15.5a3.5 3.5 0 0 1 5 0M12 19h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>Tidak ada koneksi internet</h1>
    <p>Aplikasi membutuhkan koneksi internet untuk mengambil dan menyimpan data. Periksa jaringan Anda, lalu coba kembali.</p>
    <button type="button" onclick="retry()">Coba Lagi</button>
  </main>
  <script>
    async function retry() {
      try {
        await fetch("/", { method: "HEAD", cache: "no-store" });
        window.location.replace("/");
      } catch {
        window.location.reload();
      }
    }
    window.addEventListener("online", retry);
  </script>
</body>
</html>
